services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: upgradx
      POSTGRES_PASSWORD: upgradx
      POSTGRES_DB: upgradx
    ports:
      - "5432:5432"
    volumes:
      - upgradx_pgdata:/var/lib/postgresql/data

volumes:
  upgradx_pgdata:
